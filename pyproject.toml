[project]
name = "agentcad-runtime"
version = "0.1.0"
description = "Agent-native, headless CAD runtime: 2D drawings (DXF) and 3D parametric parts (FreeCAD), with CLI, MCP and Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.3,<2",
    "mcp>=1.20,<2",
    "pypdf>=4",
]

[project.optional-dependencies]
preview = ["pillow>=10"]
live = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "pillow>=10", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
agentcad = "agentcad.cli:main"
agentcad-mcp = "agentcad.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcad"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/docs/comparison-native-dwg.md",
    "/docs/assets/native-dwg-times.svg",
    "/docs/assets/native-dwg-repeat-outcomes.svg",
    "/docs/assets/native-dwg-live-lock.svg",
    "/docs/assets/native-dwg-live-lock-results.json",
    "/docs/assets/native-dwg-fixed-repeat.svg",
    "/docs/assets/native-dwg-fixed-repeat-results.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

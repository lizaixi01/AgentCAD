[project]
name = "agentcad"
version = "0.1.0"
description = "Agent-native, headless 2D CAD runtime (DXF) with CLI, MCP and Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ezdxf>=1.3,<2",
    "mcp>=1.20,<2",
    "pypdf>=4",
]

[project.optional-dependencies]
preview = ["pillow>=10"]
live = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8", "pillow>=10", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
agentcad = "agentcad.cli:main"
agentcad-mcp = "agentcad.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

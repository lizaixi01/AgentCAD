<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 492" role="img" aria-labelledby="title desc">
<title id="title">实时编辑文件锁修复：AutoCAD 2027 实机复核</title>
<desc id="desc">同版本两张图：写入打开时零次修改成功，共两次；显式以只读方式重开后两次均成功。修复后两张图各两轮、每轮三次编辑，共十二次编辑同步成功；中位耗时4.72秒，范围4.38至5.49秒。四次编辑回传、冲突保护、检查点恢复以及DWG回读审核全部通过。</desc>

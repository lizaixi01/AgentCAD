<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="AgentCAD">
<title>AgentCAD</title>
<style>/*__FLUID_CSS__*/</style>
<style>
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 56px; }
.head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.head .logo, .head .logo svg { width: 44px; height: 44px; flex: none; display: block; }
.head .ff-display { overflow-wrap: anywhere; }
.view { padding: 16px; margin-bottom: 18px; }
.view .bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.pic { background: #fff; border-radius: var(--radius-m); box-shadow: var(--shadow-1); overflow: hidden; position: relative; }
.pic img { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; }
.cmp .after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut, 50%)); background: #fff; }
.cmp .after img { width: 100%; height: 100%; }
.cmp .line { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; margin-left: -1px; background: var(--ff-accent); pointer-events: none; }
.cmp .knob { position: absolute; top: 50%; left: var(--cut, 50%); width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
             background: var(--ff-accent); color: #fff; display: grid; place-items: center; pointer-events: none; box-shadow: var(--shadow-4); }
.cmp input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.cmp .lbl { position: absolute; top: 12px; pointer-events: none; }
.cmp .lbl.b { left: 12px; } .cmp .lbl.a { right: 12px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }
.hist { padding: 16px 12px; }
.hist .ff-title { padding: 0 12px 8px; }
.hist .ff-item { align-items: flex-start; cursor: default; }
.mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ok-soft); color: var(--ok); margin-top: 2px; }
.mark svg { width: 16px; height: 16px; }
.mark.bad { background: var(--bad-soft); color: var(--bad); }
.ft { overflow-wrap: anywhere; }
.pills { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 1px; }
.pills .ff-badge { height: 22px; padding: 0 8px; }
footer { text-align: center; margin-top: 26px; }
@media (max-width: 640px) { .wrap { padding: 22px 16px 40px; } .view { padding: 12px; } }
</style>
</head>
<body class="ff">
<div class="wrap ff-reveal">
  <div class="head">
    <span class="logo" aria-hidden="true"><!--__LOGO__--></span>
    <div><h1 class="ff-display" id="name"></h1><div class="ff-caption" id="meta"></div></div>
  </div>
  <section class="ff-card view">
    <div class="bar"><div class="ff-seg" id="tabs" role="group"></div></div>
    <div class="pic" id="pic"></div>
    <div class="legend ff-caption" id="legend" hidden><span><i style="background:#16a34a"></i><span id="lgA"></span></span><span><i style="background:#ea580c"></i><span id="lgM"></span></span><span><i style="background:#b8bcc4"></i><span id="lgO"></span></span></div>
  </section>
  <section class="ff-card hist"><h2 class="ff-title" id="histT"></h2><ol class="ff-list" id="hist"></ol></section>
  <footer class="ff-caption" id="foot"></footer>
</div>
<script>/*__FLUID_JS__*/</script>
<script>/*__FRIENDLY__*/</script>
<script id="data" type="application/json">"__DATA__"</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const F = window.AgentCADFriendly, L = /^zh\b/i.test(navigator.language || "") ? "zh" : "en", t = (k, v) => F.t(k, v, L);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg>';
  const name = String(D.name || "").split("/").pop();
  document.documentElement.lang = L === "zh" ? "zh-CN" : "en";
  document.title = name + " · AgentCAD";
  $("name").textContent = name;
  const when = D.exported ? new Date(D.exported.replace(/([+-]\d\d)(\d\d)$/, "$1:$2")) : new Date();
  $("meta").textContent = `${D.kind === "part" ? t("part") : t("drawing")} · ${t("exportedFrom", { d: when.toLocaleString(L === "zh" ? "zh-CN" : undefined) })}`;
  $("lgA").textContent = t("legendAdded"); $("lgM").textContent = t("legendModified"); $("lgO").textContent = t("legendOther");
  const views = [["drawing", D.kind === "part" ? t("part") : t("drawing"), D.image]];
  if (D.image_changes) views.push(["changes", t("highlight"), D.image_changes]);
  if (D.image_before && D.image_after) views.push(["compare", t("compare"), null]);
  function show(key) {
    const pic = $("pic"); pic.className = "pic"; pic.style.removeProperty("--cut");
    $("legend").hidden = key !== "changes";
    if (key === "compare") {
      pic.className = "pic cmp";
      pic.innerHTML = `<img alt="${esc(t("before"))}" src="${D.image_before}"><div class="after"><img alt="${esc(t("after"))}" src="${D.image_after}"></div>` +
        `<div class="line"></div><div class="knob"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6-6 6 6 6M15 6l6 6-6 6"/></svg></div>` +
        `<span class="ff-badge lbl b">${esc(t("before"))}</span><span class="ff-badge info lbl a">${esc(t("after"))}</span>` +
        `<input type="range" min="0" max="100" value="50" aria-label="${esc(t("compare"))}">`;
      const inp = pic.querySelector("input");
      inp.oninput = () => pic.style.setProperty("--cut", inp.value + "%");
      return;
    }
    const v = views.find((x) => x[0] === key);
    pic.innerHTML = `<img alt="${esc(name)}" src="${v[2]}">`;
  }
  if (views.length > 1) {
    views.forEach(([k, label], i) => {
      const b = document.createElement("button"); b.value = k; b.textContent = label; b.setAttribute("aria-pressed", String(i === 0));
      $("tabs").appendChild(b);
    });
    Fluid.segmented($("tabs"), show);
  } else $("tabs").parentElement.hidden = true;
  show("drawing");
  $("histT").textContent = t("historyTitle");
  const ol = $("hist");
  for (const r of (D.history || []).slice().reverse()) {
    const li = document.createElement("li");
    li.className = "ff-item" + (r.shown ? " sel" : "");
    const ch = r.changes || {};
    const pills = r.ok ? [["ok", "+", ch.added], ["warn", "~", ch.modified], ["bad", "−", ch.deleted]].filter((x) => x[2])
      .map((x) => `<span class="ff-badge ${x[0]}">${x[1]}${esc(x[2])}</span>`).join("") : "";
    // every piece is escaped here; the only markup is the span built around the (escaped) failure text
    const sub = ["#" + r.seq, r.ts ? new Date(r.ts).toLocaleString(L === "zh" ? "zh-CN" : undefined) : ""]
      .concat(r.shown ? [t("shownVersion")] : []).filter(Boolean).map(esc);
    if (!r.ok) sub.push(`<span style="color:var(--bad)">${esc(t("failed"))}${r.error ? ": " + esc(r.error.message || r.error.code) : ""}</span>`);
    li.innerHTML = `<span class="mark ${r.ok ? "" : "bad"}">${r.ok ? OK : BAD}</span><div><div class="ft">${esc(F.summary({ tool: r.tool, steps: r.steps, drawing: D.name }, L))}` +
      (pills ? `<span class="pills">${pills}</span>` : "") + `</div>` +
      (r.label ? `<div class="sub">${esc(r.label)}</div>` : "") + `<div class="sub">${sub.join(" · ")}</div></div>`;
    ol.appendChild(li);
  }
  Fluid.fluidHover(ol);
  $("foot").textContent = t("madeWith");
})();
</script>
</body>
</html>
